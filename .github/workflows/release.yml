name: Release

# Builds the Steam Deck deliverable.
#
# Runs on ubuntu-22.04 deliberately: it ships glibc 2.35, which is old enough
# for SteamOS. Building on a newer runner (24.04 = glibc 2.39) produces a binary
# that refuses to start on the Deck with a "GLIBC_2.3x not found" error, since
# glibc is forward- but not backward-compatible.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to publish the artifacts under"
        required: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run check
          npm test

      - name: Validate desktop entry
        run: |
          sed 's|APPIMAGE_PATH|/usr/bin/true|' packaging/ggmusicmaker.desktop > /tmp/check.desktop
          desktop-file-validate /tmp/check.desktop

      - name: Build AppImage and .deb
        # build:deck = tauri build + scripts/fix-appimage.sh (strips host-tied
        # libs that otherwise blank the WebView on SteamOS).
        run: npm run build:deck

      - name: Smoke-test that the binary launches
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          echo "Built: $APPIMAGE"
          file "$APPIMAGE"
          # Launch under a virtual display; the window opens and we kill it.
          # Catches missing shared libraries and WebKit loader failures.
          timeout 45 xvfb-run -a "$APPIMAGE" --appimage-extract-and-run &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is running."
            kill "$PID" 2>/dev/null || true
          else
            wait "$PID"; STATUS=$?
            echo "App exited early with status $STATUS"
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist-artifacts/ \;
          cp packaging/ggmusicmaker.desktop scripts/install-steamdeck.sh dist-artifacts/
          ls -lh dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ggmusicmaker-linux
          path: dist-artifacts/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          body: |
            **GgMusicMaker** — Steam Deck build.

            1. Download `GgMusicMaker_*.AppImage` and `install-steamdeck.sh`
            2. `chmod +x install-steamdeck.sh && ./install-steamdeck.sh <the AppImage>`
            3. Launch **GgMusicMaker** from the application menu.

            Built on Ubuntu 22.04 (glibc 2.35) for SteamOS compatibility.
