name: Release

# Builds the Steam Deck / Steam deliverables from a v* tag (or by hand):
#   - GgMusicMaker-<v>-x86_64.AppImage   desktop install (scripts/install-steamdeck.sh)
#   - GgMusicMaker-<v>-linux-x64.tar.gz  the Steam depot (release/linux-unpacked)
#
# ubuntu-22.04 on purpose: glibc 2.35, old enough for SteamOS. The packaged
# app is driven end to end (tests/electron-app.mjs) before anything is
# published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev xvfb libgbm1 libnss3 libxss1 libgtk-3-0 desktop-file-utils
          printf 'pcm.!default { type null }\nctl.!default { type hw card 0 }\n' > ~/.asoundrc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Native engine
        working-directory: native
        run: |
          cargo test --release --lib
          cargo build --release
          cp target/release/libggmm_engine.so ggmm-engine.node

      - name: Type-check and unit tests
        run: |
          npm run check
          npm test

      - name: Validate desktop entry
        run: |
          sed 's|APPIMAGE_PATH|/usr/bin/true|' packaging/ggmusicmaker.desktop > /tmp/check.desktop
          desktop-file-validate /tmp/check.desktop

      - name: Package (Steam depot folder + AppImage)
        run: npm run dist:deck

      - name: Drive the packaged app end to end
        run: |
          npx playwright-core install --with-deps chromium
          GGMM_APP=release/linux-unpacked/ggmusicmaker xvfb-run -a npm run test:app

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-artifacts
          cp release/GgMusicMaker-*.AppImage dist-artifacts/
          tar -C release -czf "dist-artifacts/GgMusicMaker-${VERSION}-linux-x64.tar.gz" linux-unpacked
          cp scripts/install-steamdeck.sh dist-artifacts/
          ls -lh dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ggmusicmaker-linux
          path: dist-artifacts/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          body: |
            **GgMusicMaker** — Steam Deck / Linux build (Electron + native Rust audio engine).

            - Desktop: download the `.AppImage` and `install-steamdeck.sh`, then
              `chmod +x install-steamdeck.sh && ./install-steamdeck.sh GgMusicMaker-*.AppImage`
            - Steam depot: the `linux-x64.tar.gz` is the folder SteamPipe uploads (see `steam/README.md`).

            Built on Ubuntu 22.04 (glibc 2.35) for SteamOS compatibility.
