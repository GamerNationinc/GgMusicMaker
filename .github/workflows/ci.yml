name: CI

# Every push to main and every pull request: the whole app, not just the
# frontend — type-check, the Rust engine's own tests, the unit tests
# (including native-vs-JS DSP parity, which needs the engine built), the
# production build, Chromium + WebKit browser checks, and the real Electron
# app driven end to end under a virtual display (including the native engine
# playing through a PulseAudio null sink, since runners have no sound card).
#
# ubuntu-22.04 on purpose: glibc 2.35 matches the release build and SteamOS.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages (ALSA headers for the engine, display for Electron)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pulseaudio libasound2-plugins xvfb libgbm1 libnss3 libxss1 libgtk-3-0
          # No sound card on the runner: a real-time virtual one (PulseAudio
          # null sink behind ALSA's default), so the native engine's clock
          # runs at wall speed — ALSA's plain null device doesn't pace.
          bash scripts/ci-audio.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            native/target
            native/stems/target
          key: ${{ runner.os }}-native-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/stems/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-native-

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Native engine — Rust tests + release build
        working-directory: native
        run: |
          cargo test --release --lib
          cargo build --release
          cp target/release/libggmm_engine.so ggmm-engine.node

      - name: Stem separator — Rust tests + release build, model download
        run: |
          (cd native/stems && cargo test --release && cargo build --release && cp target/release/ggmm-separate ../ggmm-separate)
          bash scripts/fetch-model.sh

      - name: Unit tests (incl. native/JS DSP parity)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium + WebKit for browser tests
        run: npx playwright-core install --with-deps chromium webkit

      - name: Browser integration tests (Chromium)
        run: npm run test:browser

      - name: Timeline checks in WebKit
        run: node tests/webkit-lanes.mjs

      - name: Desktop app end to end (Electron + native engine)
        run: xvfb-run -a npm run test:app

      - name: Crash recovery end to end (autosave, crash log, hung-window close)
        run: xvfb-run -a npm run test:recovery

      - name: Native recording end to end (calibration + overdub alignment, null-sink loopback)
        run: xvfb-run -a npm run test:record

      - name: Stem separation end to end (real song → stems that add back up; cancel)
        run: xvfb-run -a npm run test:stems

      - name: "Big session end to end (1.2 GB: autosave, kill, recover, save, open, export)"
        run: xvfb-run -a npm run test:big
