[package]
name = "ggmm-stems"
version = "0.1.0"
edition = "2021"
description = "GgMusicMaker stem separation (HTDemucs via ONNX Runtime), run as a separate process"
license = "UNLICENSED"
publish = false

[lib]
name = "ggmm_stems"
path = "src/lib.rs"

[[bin]]
name = "ggmm-separate"
path = "src/main.rs"

[dependencies]
# Static ONNX Runtime, fetched once at build time (cached in ggmm-ort-cache).
ort = "=2.0.0-rc.10"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
