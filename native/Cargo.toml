[package]
name = "ggmm-engine"
version = "0.1.0"
edition = "2021"
description = "GgMusicMaker native audio engine: real-time mixer + FX on its own thread, straight to ALSA/PipeWire"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
cpal = "0.15"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
rtrb = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
