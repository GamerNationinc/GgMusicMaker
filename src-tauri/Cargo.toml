[package]
name = "profitpals-daw"
version = "0.1.0"
description = "ProfitPals DAW — a simple, playful DAW for the Steam Deck"
authors = ["ProfitPals"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "profitpals_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebKitGTK is only needed on Linux, to grant the microphone permission that
# recording depends on (see src/lib.rs). Version must track what Tauri v2 uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[features]
# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]
